services:
  hotel-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hotel_sqlserver_container
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=OOP_Class_123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - ./database:/data
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data: